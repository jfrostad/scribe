<div style="display: flex; align-items: flex-start; gap: 0.5rem; padding: 0.4rem 0; border-bottom: 1px solid var(--border);"
     class="{{ 'action-done' if action.status == 'done' }}">
    <input type="checkbox"
           {{ 'checked' if action.status == 'done' }}
           hx-patch="/api/sessions/{{ session.dir_name }}/actions/{{ action.id }}"
           hx-headers='{"Content-Type": "application/json"}'
           hx-target="#action-{{ action.id }}"
           hx-swap="innerHTML"
           style="margin-top: 0.3rem; cursor: pointer;">
    <div style="flex: 1;">
        <span>{{ action.text }}</span>
        {% if action.owner %}
        <span class="owner-pill {{ action.owner|lower }}">{{ action.owner }}</span>
        {% endif %}
    </div>
    <button class="btn" style="font-size: 0.65rem; padding: 0.2rem 0.4rem; color: var(--red); border-color: var(--border);"
            hx-delete="/api/sessions/{{ session.dir_name }}/actions/{{ action.id }}"
            hx-target="#action-items-area"
            hx-swap="innerHTML">
        &times;
    </button>
</div>
