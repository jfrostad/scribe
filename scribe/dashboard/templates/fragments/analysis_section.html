<div class="card" style="margin-bottom: 1rem;">
    <div class="card-header">
        <h3>Analysis</h3>
        <div style="display: flex; gap: 0.5rem; align-items: center;">
            <span id="reanalyze-spinner" class="htmx-indicator dim">analyzing...</span>
            <button class="btn"
                    hx-post="/api/sessions/{{ session.dir_name }}/reanalyze"
                    hx-target="#analysis-section"
                    hx-swap="innerHTML"
                    hx-indicator="#reanalyze-spinner">
                re-analyze
            </button>
        </div>
    </div>
    {% if analysis_html %}
    <div class="analysis-content">{{ analysis_html|safe }}</div>
    {% else %}
    <p class="dim">No analysis available. Click re-analyze to generate one.</p>
    {% endif %}
</div>
